<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT Solution</title>
<style>
:root{
  --ink:#16202e; --ink-2:#2b3a4f; --paper:#f4f6f8; --card:#ffffff; --line:#d9dfe6;
  --muted:#64748b; --accent:#0f766e; --accent-dark:#0b5a54; --danger:#b42318;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45}
.app{display:flex;min-height:100%}
aside{width:210px;background:var(--ink);color:#e6ebf1;padding:20px 12px;flex-shrink:0}
aside h1{font-size:18px;margin:0 8px 18px;font-weight:700;letter-spacing:.2px}
aside button{display:block;width:100%;text-align:left;background:none;border:0;color:#b9c4d2;padding:10px 12px;border-radius:6px;font:inherit;cursor:pointer;margin-bottom:2px}
aside button:hover{background:var(--ink-2);color:#fff}
aside button.on{background:var(--accent);color:#fff}
main{flex:1;padding:24px;min-width:0;width:100%}
h2{margin:0 0 16px;font-size:22px}
h3{margin:0 0 10px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.btn{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
button.btn:hover{background:var(--accent-dark)}
button.ghost{background:none;border:1px solid var(--line);padding:6px 10px;border-radius:6px;font:inherit;cursor:pointer;color:var(--ink)}
button.ghost:hover{background:var(--paper)}
button.danger{color:var(--danger);border-color:#f0c4c0}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.items td input,.items td select{min-width:70px}
.items td:first-child{min-width:200px}
.items td:first-child input{margin-top:4px}
.totals{margin-left:auto;max-width:300px;margin-top:12px}
.totals div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.totals .grand{font-size:18px;font-weight:700;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.empty{color:var(--muted);padding:18px;text-align:center}
.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#viewer{position:fixed;inset:0;background:rgba(22,32,46,.55);overflow:auto;padding:20px;z-index:10}
#viewer[hidden]{display:none}
.viewer-box{max-width:800px;margin:0 auto}
.viewer-bar{display:flex;gap:8px;margin-bottom:10px}
#sheet{background:#fff;padding:0;border-radius:10px;color:#16202e;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#sheet .top{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:12px;margin-bottom:14px}
#sheet h1{margin:0;font-size:22px}
#sheet .meta{text-align:right}
#sheet .small{font-size:13px;color:#333}
#sheet table th{color:#333;border-bottom:1px solid #000}
#sheet table td{border-bottom:1px solid #ddd}
#sheet .foot{margin-top:24px;font-size:13px;color:#333;white-space:pre-line}

#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;color:#e8f6f6;
  background:radial-gradient(circle at 12% 8%,#12828a 0,transparent 42%),radial-gradient(circle at 92% 96%,#0b6068 0,transparent 45%),#064a50}
#login[hidden]{display:none}
#login .rings{position:absolute;left:50%;top:50%;width:min(1100px,150vw);height:min(1100px,150vw);margin:calc(min(1100px,150vw) / -2) 0 0 calc(min(1100px,150vw) / -2);pointer-events:none;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#login .lbrand{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:26px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:20px;letter-spacing:.2px}
#login .lbrand svg{width:32px;height:32px}
#login .lcard{position:relative;width:100%;max-width:400px;background:rgba(3,48,53,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:34px 30px;box-shadow:0 24px 60px rgba(0,25,28,.45)}
#login h2{margin:0 0 4px;font-size:26px;color:#fff}
#login .sub{color:#a9d3d4;font-size:14px}
#login .f{margin-top:18px}
#login label{color:#c4e4e5;font-size:13px;margin-bottom:6px}
#login input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;padding:12px 14px;border-radius:9px}
#login input::placeholder{color:#7fb0b2}
#login input:focus,#login input:focus-visible{outline:2px solid #f2a93b;outline-offset:1px;background:rgba(255,255,255,.12)}
#login .pwbox{position:relative}
#login .pwbox input{padding-right:64px}
#login .pwbox button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#a9d3d4;font:inherit;font-size:13px;padding:8px;cursor:pointer}
#login .lerr{color:#ffb4a8;min-height:1.3em;margin-top:12px;font-size:13px}
#login .lgo{width:100%;margin-top:6px;padding:13px;border:0;border-radius:9px;background:#f2a93b;color:#10282a;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
#login .lgo:hover{background:#ffbb55}
#login .lgo:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#login .rings{animation:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px}
.stat{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:18px;font:inherit;color:var(--ink);cursor:pointer}
.stat:hover{border-color:var(--accent)}
.stat.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
.stat .l{color:var(--muted);font-size:14px}
.stat .v{font-size:28px;font-weight:700;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.stat .n{font-size:13px;color:var(--muted)}
.stat.due .v{color:var(--danger)}.stat.paid .v{color:#15803d}
.dueb{background:#fdecea;color:var(--danger)}
#pay{position:fixed;inset:0;z-index:30;background:rgba(22,32,46,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
#pay[hidden]{display:none}
#pay .box{background:#fff;border-radius:10px;padding:22px;max-width:480px;width:100%;margin-top:4vh}
.stat{position:relative;overflow:hidden;padding:18px 18px 18px 22px;box-shadow:0 1px 2px rgba(22,32,46,.05)}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.stat.due{background:linear-gradient(135deg,#fff 40%,#fff1ef)}.stat.due::before{background:#d92d20}
.stat.paid{background:linear-gradient(135deg,#fff 40%,#eaf8ee)}.stat.paid::before{background:#16a34a}
.stat.tdy{background:linear-gradient(135deg,#fff 40%,#e6f6f4)}
.stat .ic{position:absolute;right:16px;top:16px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:#e6f6f4;color:var(--accent)}
.stat.due .ic{background:#fde4e1;color:#d92d20}.stat.paid .ic{background:#d9f2e0;color:#16a34a}
.charts{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.charts .card{margin-bottom:0}
.charts .wide{grid-column:1 / -1}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ch-h h3{margin:0}
.seg{display:flex;gap:4px}.seg button{padding:4px 10px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:12px;background:#eef2f5;border-radius:6px;overflow:hidden}
.hb .tr div{height:100%;background:linear-gradient(90deg,#f59e0b,#d92d20);border-radius:6px}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
#choice{position:fixed;inset:0;z-index:20;background:rgba(22,32,46,.55);display:flex;align-items:center;justify-content:center;padding:20px}
#choice[hidden]{display:none}
#choice .box{background:#fff;border-radius:10px;padding:22px;max-width:360px;width:100%}
#choice .box h3{margin-bottom:4px}
.logo-thumb{max-height:38px;max-width:90px;display:block}
.badge{display:inline-block;font-size:11px;background:#e6f4f1;color:var(--accent-dark);border-radius:10px;padding:1px 8px;margin-left:6px}
.warn{background:#fff6e5;border:1px solid #f1d29b;border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:13px}
aside .out{margin-top:14px;border-top:1px solid #2b3a4f;border-radius:0;padding-top:12px}
@media (max-width:720px){
  .app{flex-direction:column}
  aside{width:100%;display:flex;flex-wrap:wrap;gap:4px;padding:10px}
  aside h1{width:100%;margin:0 4px 4px}
  aside button{width:auto;padding:8px 10px}
  main{padding:14px}
}
aside button[hidden]{display:none}
.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.perms label{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;margin:0;cursor:pointer}
.perms input{width:auto}
.sec{margin:18px 0 8px;font-size:14px;color:var(--ink-2);font-weight:700}
.rt{font-size:12px;color:var(--muted);max-width:260px}

/* ---- colourful invoice ---- */
#sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.inv-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;padding:26px 32px 22px;color:#fff;background:linear-gradient(120deg,#064a50 0%,#0f766e 60%,#14a08f 100%);position:relative}
.inv-hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,#f2a93b,#f59e0b,#f2a93b)}
.inv-co{display:flex;gap:14px;align-items:center;min-width:0}
.inv-logo{background:#fff;border-radius:10px;padding:5px;display:flex;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.inv-logo img{max-height:64px;max-width:120px;display:block;border-radius:6px}
#sheet .inv-hd h1{margin:0;font-size:24px;color:#fff;letter-spacing:.2px}
#sheet .inv-hd .small{color:#d6f1ee;font-size:13px;margin-top:2px}
.inv-meta{text-align:right}
.inv-meta .tt{font-size:30px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#ffd58a;line-height:1}
.inv-meta .no{font-size:17px;font-weight:700;margin-top:8px}
.inv-meta .dt{font-size:13px;color:#d6f1ee}
.inv-st{display:inline-block;margin-top:8px;padding:3px 14px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:#16a34a;color:#fff}
.inv-st.due{background:#d92d20}.inv-st.part{background:#f59e0b;color:#3b2500}
.inv-body{padding:22px 32px 26px}
.inv-bill{background:#eaf6f4;border-left:5px solid #0f766e;border-radius:8px;padding:12px 16px;margin-bottom:18px}
.inv-bill .lb{font-size:11px;font-weight:700;color:#0f766e;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.inv-bill .nm{font-size:17px;font-weight:700}
#sheet .inv-tbl{width:100%;border-collapse:separate;border-spacing:0;border-radius:8px;overflow:hidden;border:1px solid #cfe6e2}
#sheet .inv-tbl th{background:#0f766e;color:#fff;border:0;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
#sheet .inv-tbl td{border:0;border-bottom:1px solid #e3efed;padding:10px 12px}
#sheet .inv-tbl tbody tr:nth-child(even) td{background:#f3faf9}
#sheet .inv-tbl tbody tr:last-child td{border-bottom:0}
.inv-tot{margin:18px 0 0 auto;max-width:330px;background:#f6f9fb;border:1px solid #dbe5ec;border-radius:10px;padding:10px 16px}
.inv-tot div{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.inv-tot .disc span:last-child{color:#d92d20}
.inv-tot .grand{margin:8px -16px 0;padding:11px 16px;border-radius:0 0 9px 9px;background:linear-gradient(120deg,#064a50,#0f766e);color:#fff;font-size:19px;font-weight:800}
.inv-tot .grand span:last-child{color:#ffd58a}
.inv-tot .paid span:last-child{color:#15803d;font-weight:700}
.inv-tot .bal{font-weight:800;color:#d92d20}
.inv-ft{margin-top:24px;padding:12px 16px;border-radius:8px;background:#fff7e6;border:1px dashed #f2a93b;color:#5a4210;font-size:13px;white-space:pre-line;text-align:center}

.inv-sum{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;margin-top:18px}
.inv-sum .inv-tot{margin:0 0 0 auto;flex:0 0 330px;max-width:100%}
.inv-pay{flex:1;min-width:150px;font-size:11px;line-height:1.35;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.inv-pay .small{font-size:10px}
.inv-pay img{width:84px;height:84px;object-fit:contain;image-rendering:pixelated;display:block}
.inv-pay .lb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
#dsn{position:fixed;right:10px;top:70px;display:flex;flex-direction:column;gap:6px;z-index:12;max-height:calc(100vh - 90px);overflow-y:auto;padding:2px}
#dsn[hidden]{display:none}
#dsn b{color:#fff;font-size:12px;text-align:center}
#dsn button{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #fff;border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;text-align:left}
#dsn button i{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.2)}
#dsn button.on{border-color:#f59e0b;font-weight:700}
@media (max-width:900px){#dsn{top:auto;bottom:0;left:0;right:0;flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;background:rgba(22,32,46,.92);padding:8px}#dsn b{display:none}}
/* ---- bill designs (variables: header, header text, header sub text, accent, light tint, border, title colour, total amount colour) ---- */
#sheet.tx .inv-hd{background:var(--hd);color:var(--hdt)}
#sheet.tx .inv-hd::after{background:var(--tt)}
#sheet.tx .inv-hd h1{color:var(--hdt)}
#sheet.tx .inv-hd .small,#sheet.tx .inv-meta .dt{color:var(--hds)}
#sheet.tx .inv-meta .tt{color:var(--tt)}
#sheet.tx .inv-bill{background:var(--lt);border-left-color:var(--ac)}
#sheet.tx .inv-bill .lb,#sheet.tx .inv-pay .lb{color:var(--ac)}
#sheet.tx .inv-tbl{border-color:var(--bd)}
#sheet.tx .inv-tbl th{background:var(--ac);color:#fff}
#sheet.tx .inv-tbl td{border-bottom-color:var(--bd)}
#sheet.tx .inv-tbl tbody tr:nth-child(even) td{background:var(--lt)}
#sheet.tx .inv-tot{background:var(--lt);border-color:var(--bd)}
#sheet.tx .inv-tot .grand{background:var(--ac)}
#sheet.tx .inv-tot .grand span:last-child{color:var(--gt)}
#sheet.tx .inv-ft{background:var(--lt);border-color:var(--ac);color:#333}
#sheet.lh .inv-hd{border-bottom:4px solid var(--ac)}
#sheet.lh .inv-hd::after{display:none}
#sheet.lh .inv-logo{box-shadow:none;border:1px solid var(--bd)}
#sheet.th1{--hd:#fff;--hdt:#111;--hds:#555;--ac:#111;--lt:#f5f5f5;--bd:#cfcfcf;--tt:#111;--gt:#fff}
#sheet.th2{--hd:linear-gradient(120deg,#1e3a8a,#2563eb);--hdt:#fff;--hds:#dbeafe;--ac:#1d4ed8;--lt:#eff6ff;--bd:#bfdbfe;--tt:#fde68a;--gt:#fde68a}
#sheet.th3{--hd:linear-gradient(120deg,#1f2937,#111827 60%,#b91c1c);--hdt:#fff;--hds:#e5e7eb;--ac:#c8102e;--lt:#fdf2f2;--bd:#f3c1c1;--tt:#fff;--gt:#fff}
#sheet.th4{--hd:#0b1f3a;--hdt:#fff;--hds:#b8c4d8;--ac:#0b1f3a;--lt:#f4f6fa;--bd:#cfd8e6;--tt:#e0b252;--gt:#e0b252}
#sheet.th5{--hd:linear-gradient(120deg,#065f46,#10b981);--hdt:#fff;--hds:#d1fae5;--ac:#047857;--lt:#ecfdf5;--bd:#a7f3d0;--tt:#fef08a;--gt:#fef08a}
#sheet.th6{--hd:linear-gradient(120deg,#4c1d95,#7c3aed);--hdt:#fff;--hds:#ede9fe;--ac:#6d28d9;--lt:#f5f3ff;--bd:#ddd6fe;--tt:#fcd34d;--gt:#fcd34d}
#sheet.th7{--hd:#f8fafc;--hdt:#0f172a;--hds:#475569;--ac:#334155;--lt:#f1f5f9;--bd:#cbd5e1;--tt:#334155;--gt:#fff}
#sheet.th8{--hd:linear-gradient(120deg,#9a3412,#f97316);--hdt:#fff;--hds:#ffedd5;--ac:#ea580c;--lt:#fff7ed;--bd:#fed7aa;--tt:#fff;--gt:#fff}
#sheet.th9{--hd:#fff;--hdt:#111827;--hds:#4b5563;--ac:#111827;--lt:#fafafa;--bd:#e5e7eb;--tt:#111827;--gt:#111827}
#sheet.th10{--hd:linear-gradient(120deg,#9f1239,#e11d48);--hdt:#fff;--hds:#ffe4e6;--ac:#be123c;--lt:#fff1f2;--bd:#fecdd3;--tt:#fff;--gt:#fff}
#sheet.th11{--hd:#1f2937;--hdt:#fff;--hds:#cbd5e1;--ac:#0d9488;--lt:#f0fdfa;--bd:#99f6e4;--tt:#5eead4;--gt:#fff}
/* minimal "lined" layout: no filled blocks, only clean rules */
#sheet.ln .inv-bill{background:transparent;border-left-width:3px;border-radius:0}
#sheet.ln .inv-tbl{border:0;border-radius:0;border-top:2px solid var(--ac);border-bottom:2px solid var(--ac)}
#sheet.ln .inv-tbl th{background:transparent;color:var(--ac);border-bottom:1px solid var(--ac)}
#sheet.ln .inv-tbl tbody tr:nth-child(even) td{background:transparent}
#sheet.ln .inv-tot{background:transparent;border:0;border-top:2px solid var(--ac);border-radius:0}
#sheet.ln .inv-tot .grand{background:transparent;color:var(--ac);border-top:1px solid var(--ac);margin:8px 0 0;padding:10px 0 4px;border-radius:0}
#sheet.ln .inv-tot .grand span:last-child{color:var(--ac)}
#sheet.ln .inv-ft{background:transparent;border-style:solid;border-width:1px 0 0;border-radius:0}
@media (max-width:600px){.inv-hd,.inv-body{padding-left:16px;padding-right:16px}.inv-meta{text-align:left}}

/* ---- print / save as PDF ---- */
@page{size:A4 portrait;margin:0}
@media print{
  html,body{height:auto !important;margin:0;background:#fff !important}
  body>*:not(#viewer){display:none !important}
  #viewer{position:static !important;display:block;background:none !important;padding:0 !important;overflow:visible !important}
  #viewer[hidden]{display:none !important}
  .viewer-box{max-width:none !important;width:100%;margin:0 !important}
  .viewer-bar{display:none !important}
  #dsn{display:none !important}
  #sheet{width:100%;border-radius:0 !important;box-shadow:none}
  #sheet .scroll{overflow:visible !important}
  #sheet .inv-tbl{table-layout:fixed;width:100%}
  #sheet .inv-tbl td,#sheet .inv-tbl th{word-wrap:break-word;overflow-wrap:anywhere}
  .inv-hd,.inv-body{padding-left:14mm;padding-right:14mm}
  .inv-hd{padding-top:12mm}
  .inv-body{padding-bottom:12mm}
  .inv-bill,.inv-tot,.inv-ft,#sheet tr{break-inside:avoid;page-break-inside:avoid}
  #sheet thead{display:table-header-group}
}

/* ---- inventory ---- */
.ivg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.ivt{border:1px solid var(--line);border-left:5px solid #16a34a;border-radius:8px;padding:10px 12px;background:#fff}
.ivt.low{border-left-color:#f59e0b;background:#fffaf0}

<script>
/* ---------- helpers ---------- */
const KEY = 'billing-app-v1';
let cur = null; // logged-in account
let acct = null; // account whose data is open (same as cur, or a client when Admin is viewing)
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

function defaults() {
  return {
    settings: {prefix: 'INV-', nextNo: 1, note: 'Thank you for your business.'},
    businesses: [], defaultBiz: '', products: [], customers: [], invoices: [], devices: [],
    mines: {trucks: [], trips: []}
  };
}
function build(d) {
  d = d || {};
  const base = defaults(), o = d.settings || {};
  const r = {settings: Object.assign(base.settings, {prefix: o.prefix, nextNo: o.nextNo, note: o.note, pay: o.pay || {}, wa: o.wa || {}}), businesses: d.businesses || [], defaultBiz: d.defaultBiz || '', products: d.products || [], customers: d.customers || [], invoices: d.invoices || [], estimates: d.estimates || [], devices: Array.isArray(d.devices) ? d.devices : [], mines: {trucks: (d.mines && d.mines.trucks) || [], trips: (d.mines && d.mines.trips) || []}};
  if (acct && acct.role === 'user') { // company details are fixed by Admin
    if (!d.settings) r.settings.prefix = acct.prefix || 'INV-';
    const seed = {id: 'co-' + acct.id, name: acct.name, address: acct.address || '', phone: acct.phone || '', gstin: acct.gstin || '', logo: acct.logo || ''};
    r.businesses = [seed].concat((d.businesses || []).filter(b => b.id !== seed.id)); // own shops added by the user
    if (!r.businesses.some(b => b.id === d.defaultBiz)) r.defaultBiz = seed.id;
  }
  if (r.settings.prefix == null) r.settings.prefix = 'INV-';
  if (!r.settings.nextNo) r.settings.nextNo = 1;
  if (r.settings.note == null) r.settings.note = 'Thank you for your business.';
  if (!r.businesses.length) {
    r.businesses.push({id: uid(), name: o.name || 'My Shop', address: o.address || '', phone: o.phone || '', gstin: o.gstin || '', logo: ''});
  }
  if (!r.businesses.find(b => b.id === r.defaultBiz)) r.defaultBiz = r.businesses[0].id;
  return r;
}

const bizSnap = id => { const b = db.businesses.find(x => x.id === id) || defBiz(); return {name: b.name, address: b.address, phone: b.phone, gstin: b.gstin, logo: b.logo || ''}; };
let db = defaults();

/* ---------- Supabase (login + online data) ---------- */
const SB_URL = 'https://pymxqexyhighgslzrqze.supabase.co';
const SB_KEY = 'sb_publishable_LRypHFBar9BfTSgSk_GWHQ_XEY1Prpy'; // public key: safe to keep in this file

function setSync(cls, msg) { const el = $('#sync'); if (el) { el.className = cls; el.textContent = msg; } }
function chunkRows(items) { // split rows so one request is not too big
  const out = []; let g = [], size = 0;
  items.forEach(x => {
    if (g.length && (size + x.n > 1500000 || g.length >= 50)) { out.push(g); g = []; size = 0; }

async function fetchAll(owner) {
  const c = await sb.from('ib_docs').select('data').eq('owner', owner).eq('kind', 'core').maybeSingle();
  if (c.error) throw c.error;
  const rows = [];
  for (let from = 0; ; from += 40) {
    const r = await sb.from('ib_invoices').select('id,data').eq('owner', owner).order('id').range(from, from + 39);
    if (r.error) throw r.error;
    rows.push(...r.data);
    if (r.data.length < 40) break;
  }
  rows.sort((x, y) => idTime(y.id) - idTime(x.id));
  return {hadCore: !!c.data, core: (c.data && c.data.data) || {}, invoices: rows.map(r => r.data)};
}
function applyRemote(r) { // call after fetchAll, then set acct and db = load()
  remote = {core: r.core, invoices: r.invoices};
  sent = {core: '', inv: {}};
  r.invoices.forEach(i => { sent.inv[i.id] = JSON.stringify(i); });
  sent.hadCore = r.hadCore; lastPull = Date.now();
}
function afterLoad() { // db is ready: remember what the server already has
  sent.core = sent.hadCore ? JSON.stringify(coreOf(db)) : '';
  dirty = false; syncFail = 0; setSync('ok', 'All changes saved');
  const o = acct.id; getSig(o).then(x => { if (acct && acct.id === o) lastSig = x; }).catch(() => {});
  if (!sent.hadCore) save();
}
function save() {
  if (!cur || !acct) return false;
  dirty = true; setSync('busy', 'Saving…');
  clearTimeout(syncTimer); syncTimer = setTimeout(doSync, 500);
  return true;
}
async function doSync() {
  if (syncing || !dirty || !acct) return;
  syncing = true; dirty = false;
  const owner = acct.id;
  try {
    const coreStr = JSON.stringify(coreOf(db));
    if (coreStr !== sent.core) {
      const r = await sb.from('ib_docs').upsert({owner, kind: 'core', data: JSON.parse(coreStr), updated_at: new Date().toISOString()}, {onConflict: 'owner,kind'});
      if (r.error) throw r.error;
      sent.core = coreStr;
    }
    const now = {}, changed = [];
    db.invoices.forEach(i => { const t = JSON.stringify(i); now[i.id] = t; if (sent.inv[i.id] !== t) changed.push({row: {owner, id: i.id, data: i, updated_at: new Date().toISOString()}, n: t.length}); });
    for (const g of chunkRows(changed)) {
      const r = await sb.from('ib_invoices').upsert(g, {onConflict: 'owner,id'});
      if (r.error) throw r.error;
      g.forEach(x => { sent.inv[x.id] = now[x.id]; });
    }
    const gone = Object.keys(sent.inv).filter(id => !(id in now));
    for (let k = 0; k < gone.length; k += 100) {
      const part = gone.slice(k, k + 100);
      const r = await sb.from('ib_invoices').delete().eq('owner', owner).in('id', part);
      if (r.error) throw r.error;
      part.forEach(id => { delete sent.inv[id]; });
    }
    syncFail = 0;
    if (!dirty) { try { lastSig = await getSig(owner); } catch (e) { /* ignore */ } }
    setSync(dirty ? 'busy' : 'ok', dirty ? 'Saving…' : 'All changes saved');
  } catch (e) {
    console.error(e); dirty = true; syncFail++;
    setSync('bad', 'Not saved. Retrying…');
    if (syncFail === 1) toast('Could not save online. Check your internet; it will retry. Do not close this page.');
  } finally { syncing = false; }
  if (dirty) { clearTimeout(syncTimer); syncTimer = setTimeout(doSync, syncFail ? 4000 : 300); }
}
async function flush() {
  clearTimeout(syncTimer);
  for (let k = 0; k < 40 && (dirty || syncing) && syncFail < 2; k++) { if (!syncing) await doSync(); else await new Promise(r => setTimeout(r, 150)); }
  return !dirty && !syncing;
}

let lastSig = '', checking = false;
async function getSig(owner) { // cheap fingerprint of what is online (no big data downloaded)
  const c = await sb.from('ib_docs').select('updated_at').eq('owner', owner).eq('kind', 'core').maybeSingle();
  if (c.error) throw c.error;
  const ids = [];
  for (let from = 0; ; from += 1000) {
    const r = await sb.from('ib_invoices').select('id,updated_at').eq('owner', owner).order('id').range(from, from + 999);
    if (r.error) throw r.error;
    r.data.forEach(x => ids.push(x.id + '@' + x.updated_at));
    if (r.data.length < 1000) break;
  }
  return (c.data ? c.data.updated_at : '') + '|' + ids.join(',');
}

async function checkRemote(quiet) {
  if (checking || !cur || !acct || dirty || syncing || document.hidden) return;
  if (!$('#viewer').hidden || !$('#pay').hidden) return;
  checking = true;
  try {
    const owner = acct.id, sig = await getSig(owner);

}

/* ---------- calculation ---------- */
function calc(items, discPct, rnd) {
  let sub = 0, disc = 0, tax = 0;
  items.forEach(it => {
    const a = (+it.qty || 0) * (+it.price || 0);
    const d = a * (+discPct || 0) / 100;
    sub += a; disc += d; tax += (a - d) * (+it.tax || 0) / 100;
  });
  let total = sub - disc + tax, ro = 0;
  if (rnd) { ro = Math.round((Math.round(total) - total) * 100) / 100; total = Math.round(total); }
  return {sub, disc, tax, round: ro, total};
}
const lineAmt = it => (+it.qty || 0) * (+it.price || 0);

async function saveInvoice() {

    const x = {name: it.name.trim(), qty: +it.qty, price: +it.price || 0, tax: +it.tax || 0};

    customer: c ? {name: c.name, phone: c.phone, address: c.address, gstin: c.gstin} : {name: 'Walk-in customer'},

const loadJs = u => new Promise((ok, no) => { const e = document.createElement('script'); e.src = u; e.onload = ok; e.onerror = no; document.head.appendChild(e); });
async function pickQr(file) {
  if (!file) return;
  const src = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
  const im = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  if (!im) { toast('This image could not be read.'); return; }
  let out = '';
  try {
    if (!window.jsQR) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js');
    if (!window.qrcode) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');
    let code = null;
    for (const w of [800, 500, 1200, 300]) {
      const k = w / Math.max(im.width, im.height), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      code = jsQR(g.getImageData(0, 0, c.width, c.height).data, c.width, c.height, {inversionAttempts: 'attemptBoth'});
      if (code) break;
    }
    if (code && code.data) { const q = qrcode(0, 'M'); q.addData(code.data); q.make(); out = q.createDataURL(8, 2); }
  } catch (e) { out = ''; }
  if (!out) { // could not read the QR: keep the photo as it is
    const k = Math.min(1, 500 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); out = c.toDataURL('image/jpeg', 0.9);
    toast('QR could not be read. Photo saved as it is. Try a clearer, straight photo.');
  } else toast('QR cleaned. Plain QR will be printed.');
  tmpQr = out; const e = $('#aqp'); e.src = out; e.hidden = false;
}
function saveAccount() {
  const old = (db.settings.pay || {});
  db.settings.pay = {holder: $('#ah').value.trim(), bank: $('#ab').value.trim(), acno: $('#an').value.trim(), ifsc: $('#ai').value.trim().toUpperCase(), qr: tmpQr !== null ? tmpQr : (old.qr || '')};

const toISO = v => {

function parseCSV(t) {
  t = t.replace(/^﻿/, '');

  const rows = []; let r = [], c = '', q = false;

    else if (ch === '"') q = true;
    else if (ch === d) { r.push(c); c = ''; }

async function importDevices(file) {

  } catch (e) { toast('This file could not be read. Check the internet, or upload a CSV file.'); return; }
  rows = rows.filter(r => r.some(c => String(c).trim() !== ''));
  if (!rows.length) { toast('The file is empty.'); return; }
  const h = rows[0].map(c => String(c).toLowerCase()), used = new Set();
  const col = re => { const k = h.findIndex((c, j) => !used.has(j) && re.test(c)); if (k >= 0) used.add(k); return k; };

  rows.slice(head ? 1 : 0).forEach(r => {
    const imei = String(get(r, ci.imei)).trim().replace(/\s+/g, '');

    if (seen.has(imei)) { dup++; return; }
    seen.add(imei);
    const ex = get(r, ci.exp), expiry = toISO(ex); if (String(ex).trim() && !expiry) nodate++;
    const data = {imei, vehicle: normVeh(get(r, ci.veh)), name: String(get(r, ci.nm)).trim(), phone: String(get(r, ci.ph)).trim(), expiry, iccid: String(get(r, ci.ic)).replace(/\D/g, ''), plan: String(get(r, ci.pl)).trim()};

  });

  upd.forEach(([o, data]) => Object.keys(data).forEach(k => { if (data[k]) o[k] = data[k]; }));

const TD_TPL = "$DP,TNOWTN,2.0.4,NR,01,L,{IMEI},0000,1,{DATE},{TIME},{LAT},{NS},{LON},{EW},0.0,207.78,45,265.5,0.60,0.40,airtel,0,1,25.6,4.0,0,C,29,404,97,06BC,3014,31,06BC,8E3C,31,06BC,8E1E,31,06BC,6E01,31,06BC,585A,0000,00,0,85091.887,0,0,{SEQ},(),{CRC}*";

/* CRC32 (IEEE) */
const TDT = [...Array(256)].map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });

function tdPacket(imei, lat, lon, seq) {

    LAT: Math.abs(lat).toFixed(8), NS: lat < 0 ? 'S' : 'N', LON: Math.abs(lon).toFixed(8), EW: lon < 0 ? 'W' : 'E', SEQ: String(seq % 1000000).padStart(6, '0')};

/* send loop */
async function tdStart() {
  if (tdRun || !cur || !can('td')) return;
  const adm = cur.role === 'admin', imei = ($('#td-imei').value || '').replace(/\s+/g, '');
  if (!/^\d{15}$/.test(imei)) { tdStatus('IMEI must be exactly 15 digits.', 'err'); return; }
  if (!adm) await tdFreshUser();
  const c = adm ? tdReadCfg('tp') : tdCfg();
  if (!c.ip || !(+c.port > 0 && +c.port < 65536)) { tdStatus('Server IP / port is not set. Ask the Admin.', 'err'); return; }
  let sel = tdSel ? tdVeh.find(v => v.owner + '/' + v.id === tdSel) : null;
  if (!sel || sel.imei !== imei) sel = tdVeh.find(v => v.owner === cur.id && v.imei === imei) || null;
  const num = (x, d) => { const n = parseFloat(x); return Number.isFinite(n) ? n : parseFloat(d); };
  const fix = (n, d) => Number.isFinite(n) ? n : parseFloat(d);
  const lat = fix(adm ? num(c.lat, TD_DEF.lat) : num(sel && sel.lat, c.lat), TD_DEF.lat), lon = fix(adm ? num(c.lon, TD_DEF.lon) : num(sel && sel.lon, c.lon), TD_DEF.lon);
  tdJob = {imei, c, adm, lat, lon, owner: sel ? sel.owner : cur.id, veh: normVeh(($('#td-veh') || {}).value)};
  tdRun = true; tdSent = 0; tdPkt = '';
  tdUI(); tdStatus('Starting loop…', 'run');
  tdLoop();
}
function tdStop() {
  const was = tdRun;
  tdRun = false; clearTimeout(tdTimer); tdJob = null;
  tdUI();
  if (was) tdStatus('Stopped. ' + tdSent + ' packet(s) sent.', '');
}
async function tdLoop() {
  if (!tdRun) return;
  if (tdBusy) { tdTimer = setTimeout(tdLoop, 500); return; }
  tdBusy = true;
  try { await tdSendOnce(); } catch (e) { console.error(e); } finally { tdBusy = false; }
  if (tdRun) tdTimer = setTimeout(tdLoop, TD_EVERY * 1000);
}
async function tdSendOnce() {
  const j = tdJob; if (!j) return;
  const rec = tdVeh.find(v => v.owner === j.owner && v.imei === j.imei);
  const packet = tdPacket(j.imei, j.lat, j.lon, ((rec && +rec.count) || 0) + 1);
  tdPkt = j.adm ? packet : ''; const pk = $('#td-pk'); if (pk) pk.textContent = tdPkt;
  tdStatus('Sending packet…', 'sending');
  let ok = false, err = '', res = {};
  try {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
    const r = await fetch(j.c.url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ip: j.c.ip, port: +j.c.port, packet, imei: j.imei, append_crlf: false, wait_reply: true, timeout: 5}), signal: ctl.signal});
    clearTimeout(t);
    res = await r.json(); ok = !!(res && res.ok); err = ok ? '' : ((res && res.error) || 'Server did not accept the data');
  } catch (e) { err = e.name === 'AbortError' ? 'Server took too long' : 'Could not reach the server'; }
  if (ok) { tdSent++; await tdCount(j); }
  if (!tdRun) return; // stopped while this packet was on its way
  if (ok) tdStatus('Packet #' + tdSent + ' sent · ' + (res.sent_bytes || 0) + ' bytes · ' + (res.latency_ms || 0) + ' ms' + (res.reply ? '\nReply: ' + res.reply : ''), 'run');
  else tdStatus('Failed: ' + (j.adm ? err : 'the update was not sent') + ' (retrying…)', 'err');
}

/* Admin: save IP / port once, for Admin and for every user account */
async function tdSave() {
  if (!cur || cur.role !== 'admin') return;
  const raw = id => ($('#tp-' + id) ? $('#tp-' + id).value.trim() : '');
  const c = tdReadCfg('tp');
  if (!raw('ip')) { toast('Enter the Server IP.'); return; }
  if (!(+c.port > 0 && +c.port < 65536) || !/^\d+$/.test(c.port)) { toast('Port must be a number from 1 to 65535.'); return; }
  if (!Number.isFinite(parseFloat(c.lat)) || !Number.isFinite(parseFloat(c.lon))) { toast('Lat and Lon must be numbers.'); return; }
  if (!/^https?:\/\//i.test(raw('url') || 'https://')) { toast('Send address must start with https://'); return; }
  const btn = $('#td-save'); if (btn) btn.disabled = true;
  try {
    const w = await sb.from('ib_docs').upsert({owner: cur.id, kind: 'tdcfg', data: c, updated_at: new Date().toISOString()}, {onConflict: 'owner,kind'});
    if (w.error) throw w.error;
    tdAdminCfg = c;
    await loadUsers();
    let n = 0;
    for (const u of usersCache) {
      const x = await sb.from('ib_profiles').update({perms: Object.assign({}, u.perms || {}, {_td: c})}).eq('id', u.id);
      if (x.error) throw x.error;
      n++;
    }
    usersLoaded = false;
    toast('Saved. Applied to Admin and ' + n + ' user account(s).');
  } catch (e) { console.error(e); toast('Could not save: ' + errMsg(e)); }
  finally { const b = $('#td-save'); if (b) b.disabled = tdRun; }

        <td class="rt">${PERMS.filter(([k]) => pv(x.perms || {}, k) && (Array.isArray((x.perms || {})._mods) ? x.perms._mods : ['bill']).includes('bill')).concat(MINE_PERMS.filter(([k]) => (x.perms || {})[k] && Array.isArray(x.perms._mods) && x.perms._mods.includes('mines'))).map(p => p[1]).join(', ') || 'None'}</td>
        <td class="num">${billCounts[x.id] || 0}</td>
        <td><div class="row-actions"><button class="ghost" onclick="viewAs('${x.id}')">Open data</button><button class="ghost" onclick="editU = '${x.id}'; tmpLogo = usersCache.find(y => y.id === '${x.id}').logo || ''; renderUsers(); window.scrollTo(0, 0)">Edit</button>
        <button class="ghost danger" onclick="delUser('${x.id}')">Delete</button></div></td></tr>`).join('')
        : '<tr><td colspan="7" class="empty">No accounts yet. Create the first one above.</td></tr>'}</tbody></table></div></div>
    ${hasOld ? `<div class="card"><h3>Old data found in this browser</h3>
      <p style="margin-top:0;color:var(--muted)">Data saved earlier in this browser can be moved to Supabase in one click. After that it opens on every device.</p>
      ${oAdmin && (oldBills(oAdmin) || (oAdmin.products || []).length || (oAdmin.customers || []).length) ? `<div class="row-actions" style="margin-bottom:12px"><button class="btn" onclick="moveAdmin()">Move Admin data (${oldBills(oAdmin)} bills)</button></div>` : ''}
      ${oUsers.length ? `<div class="scroll"><table><thead><tr><th>Company</th><th>User ID</th><th class="num">Bills</th><th>Online</th><th></th></tr></thead><tbody>${oUsers.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td class="num">${oldBills(oldData(KEY + ':' + x.id))}</td><td>${users.some(y => y.username.toLowerCase() === String(x.username).toLowerCase()) ? 'Account exists' : 'Not created'}</td><td><button class="ghost" onclick="moveOld('${x.id}')">Move to Supabase</button></td></tr>`).join('')}</tbody></table></div>` : ''}
    </div>` : ''}`;
}
async function createAccount(username, pw, f) {
  const tmp = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'ib-tmp'}});
  const r = await tmp.auth.signUp({email: toEmail(username), password: pw});
  if (r.error) throw r.error;
  const u = r.data.user;
  if (!u || (u.identities && !u.identities.length)) throw new Error('This User ID already exists.');
  if (!r.data.session) await sb.rpc('ib_admin_confirm_user', {target: u.id});
  const ins = await sb.from('ib_profiles').insert(Object.assign({id: u.id, username, role: 'user'}, f));
  if (ins.error) { await sb.rpc('ib_admin_delete_user', {target: u.id}); throw ins.error; }
  return u.id;
}
async function saveUser() {
  const username = $('#uu').value.trim(), pw = $('#up').value, name = $('#un').value.trim();
  if (!editU) {
    if (!/^[A-Za-z0-9._-]{2,30}$/.test(username)) { toast('User ID: 2 to 30 letters, numbers, dot, dash or underscore. No spaces.'); return; }
    if (username.toLowerCase() === 'admin') { toast('This User ID is reserved.'); return; }
    if (usersCache.some(x => x.username.toLowerCase() === username.toLowerCase())) { toast('This User ID already exists.'); return; }
  }
  if ((!editU || pw) && pw.length < 6) { toast('Password must be at least 6 characters.'); return; }
  if (!name) { toast('Enter the company name.'); return; }
  const perms = {}; PERMS.concat(MINE_PERMS).forEach(([k]) => perms[k] = $('#pm-' + k).checked);
  const mods = MODS.map(m => m[0]).filter(k => $('#md-' + k).checked);
  if (!mods.length) { toast('Tick at least one software (IoT Bill or IoT Mines).'); return; }
  if (!Object.values(perms).some(Boolean)) { toast('Give at least one right.'); return; }
  perms._mods = mods;
  const data = {name, phone: $('#uph').value.trim(), gstin: $('#ug').value.trim().toUpperCase(), address: $('#ua').value.trim(), logo: tmpLogo, perms: Object.assign({}, perms, {_td: tdReadCfg('td')})};
  const btn = $('#usave'); btn.disabled = true;
  try {
    if (editU) {
      const r = await sb.from('ib_profiles').update(data).eq('id', editU); if (r.error) throw r.error;
      if (pw) { const p = await sb.rpc('ib_admin_set_password', {target: editU, new_password: pw}); if (p.error) throw p.error; }
    } else await createAccount(username, pw, Object.assign({prefix: $('#ux').value || 'INV-'}, data));
  } catch (e) { btn.disabled = false; toast(errMsg(e)); return; }
  editU = null; tmpLogo = ''; usersLoaded = false; toast('Account saved'); renderUsers();
}
async function delUser(id) {
  if (!confirm('Delete this account and ALL its bills? This cannot be undone.')) return;
  const r = await sb.rpc('ib_admin_delete_user', {target: id});
  if (r.error) { toast(errMsg(r.error)); return; }
  usersLoaded = false; renderUsers();
}

/* ---- Admin: open a client's data ---- */
function resetState() { mEditT = null; draft = newDraft(); imp = null; editP = editC = editB = editU = null; tmpLogo = ''; invQuery = ''; dashSel = ''; tab = ''; editD = null; devQ = ''; devF = ''; qc = false; }
function drawViewBar() {
  const el = $('#viewbar');
  if (viewing()) { el.hidden = false; el.innerHTML = `Viewing: <b>${esc(acct.name)}</b> (${esc(acct.username)})<button onclick="exitView()">Back to Admin</button>`; }
  else { el.hidden = true; el.innerHTML = ''; }
}
async function switchTo(p) {
  await flush();
  const r = await fetchAll(p.id);
  applyRemote(r); acct = p; db = load(); resetState(); afterLoad(); drawViewBar(); applyNav();
}
async function viewAs(id) {
  const p = usersCache.find(x => x.id === id); if (!p || cur.role !== 'admin') return;
  try { await switchTo(Object.assign({}, p)); const ml = p.perms && Array.isArray(p.perms._mods) ? p.perms._mods : ['bill']; curMod = ml.includes('bill') ? 'bill' : 'mines'; applyNav(); go(curMod === 'mines' ? 'mdash' : 'dash'); } catch (e) { console.error(e); toast('Could not open this account.'); }
}
async function exitView() {
  try { await switchTo(cur); go('users'); } catch (e) { console.error(e); toast('Could not go back. Please refresh.'); }
}

/* ---- Admin: move old browser data to Supabase ---- */
async function pushAll(owner, d) {
  const core = {settings: d.settings, businesses: d.businesses || [], defaultBiz: d.defaultBiz || '', products: d.products || [], customers: d.customers || [], devices: Array.isArray(d.devices) ? d.devices : []};
  let r = await sb.from('ib_docs').upsert({owner, kind: 'core', data: core, updated_at: new Date().toISOString()}, {onConflict: 'owner,kind'});
  if (r.error) throw r.error;
  r = await sb.from('ib_invoices').delete().eq('owner', owner);
  if (r.error) throw r.error;
  const items = (d.invoices || []).map(i => ({row: {owner, id: i.id, data: i}, n: JSON.stringify(i).length}));
  for (const g of chunkRows(items)) { const x = await sb.from('ib_invoices').insert(g); if (x.error) throw x.error; }
}
async function moveAdmin() {
  const d = oldData(KEY); if (!d) return;
  if (!confirm('Move the Admin data from this browser to Supabase?\nThis REPLACES the Admin data already online.')) return;
  try { await flush(); await pushAll(cur.id, d); await switchTo(cur); toast('Admin data moved to Supabase'); go('users'); }
  catch (e) { console.error(e); toast('Could not move data: ' + errMsg(e)); }
}
async function moveOld(oldId) {
  const u = oldUsers().find(x => x.id === oldId); if (!u) return;
  const d = oldData(KEY + ':' + oldId) || {};
  try {
    let t = usersCache.find(x => x.username.toLowerCase() === String(u.username).toLowerCase()), id;
    if (t) { if (!confirm('Account ' + u.username + ' already exists online.\nThis REPLACES its online data with the data from this browser. Continue?')) return; id = t.id; }
    else {
      let pw = u.password;
      if (!pw || pw.length < 6) { pw = prompt('Supabase needs a password of at least 6 characters for ' + u.username + '. Enter a new password:') || ''; if (pw.length < 6) { toast('Cancelled. Password too short.'); return; } }
      if (!/^[A-Za-z0-9._-]{2,30}$/.test(u.username)) { toast('User ID "' + u.username + '" has spaces or special characters. Create this account manually with a new User ID, then use Move again.'); return; }
      id = await createAccount(u.username, pw, {name: u.name || '', phone: u.phone || '', gstin: u.gstin || '', address: u.address || '', logo: u.logo || '', prefix: u.prefix || 'INV-', perms: u.perms || {}});
    }
    await pushAll(id, d);
    usersLoaded = false; toast('Moved ' + u.username + ' to Supabase'); renderUsers();
  } catch (e) { console.error(e); toast('Could not move data: ' + errMsg(e)); usersLoaded = false; }
}

/* ---------- login ---------- */
async function getProfile(id) {
  const r = await sb.from('ib_profiles').select('*').eq('id', id).maybeSingle();
  if (r.error) throw r.error;
  return r.data;
}
async function startSession(p) {
  try { applyRemote(await fetchAll(p.id)); }
  catch (e) { console.error(e); $('#le').textContent = 'Could not load your data. Check the internet and try again.'; return false; }
  cur = p; acct = p; usersLoaded = false;
  db = load(); resetState(); afterLoad(); drawViewBar();
  $('#login').hidden = true; $('#lp').value = ''; $('#le').textContent = '';
  curMod = hasMod('bill') ? 'bill' : 'mines';
  applyNav(); go(firstTab() || 'dash');
  rrSeen = null; rrCache = []; setRRBadge(0); pollReq(true);
  return true;
}
async function login() {
  const err = m => { $('#le').textContent = m; };
  if (!sb) { err('Could not load the login service. Check the internet and refresh the page.'); return; }
  const n = $('#lu').value.trim(), p = $('#lp').value;
  if (!n || !p) { err('Enter your User ID and password.'); return; }
  const btn = document.querySelector('#login .lgo'); btn.disabled = true; err('Signing in…');
  try {
    const r = await sb.auth.signInWithPassword({email: toEmail(n), password: p});
    if (r.error) { err(/invalid|credentials/i.test(r.error.message) ? 'User ID or password is wrong. Try again.' : r.error.message); return; }
    const prof = await getProfile(r.data.user.id);
    if (!prof) { await sb.auth.signOut(); err('This account is not set up yet. Please ask the Admin.'); return; }
    err('Opening your account…');
    await startSession(prof);
  } catch (e) { console.error(e); err('Could not sign in. Check the internet and try again.'); }
  finally { btn.disabled = false; }
}
function endSession() {
  curMod = 'bill'; document.body.classList.remove('mines'); $('#modbar').hidden = true; mEditT = null;
  clearTimeout(syncTimer); dirty = false; syncing = false;
  tdStop(); tdAdminCfg = null; tdVeh = []; tdSel = ''; tdSent = 0; tdPkt = ''; tdMsg = {t: 'Result will appear here', s: ''};
  cur = null; acct = null; db = defaults(); remote = {core: {}, invoices: []}; sent = {core: '', inv: {}};
  rrSeen = null; rrCache = []; setRRBadge(0);
  closeViewer(); closePay(); $('#choice').hidden = true; $('#main').innerHTML = ''; $('#viewbar').hidden = true;
  $('#login').hidden = false; $('#lu').value = ''; $('#lp').value = ''; $('#le').textContent = '';
}
async function logout() {
  if (!(await flush()) && !confirm('Your last changes are not saved online yet. Log out anyway?')) return;
  const was = cur; cur = null;
  try { await sb.auth.signOut(); } catch (e) {}
  cur = was; endSession();
  $('#lu').focus();
}
if (sb) sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && cur) endSession(); });
(async function resume() {
  if (!sb) { $('#le').textContent = 'Could not load the login service. Check the internet and refresh the page.'; return; }
  try {
    const s = await sb.auth.getSession(); if (!s.data.session) return;
    $('#le').textContent = 'Opening your account…';
    const prof = await getProfile(s.data.session.user.id);
    if (prof) await startSession(prof); else { $('#le').textContent = ''; await sb.auth.signOut(); }
  } catch (e) { console.error(e); $('#le').textContent = 'Could not open your account. Please sign in again.'; }
})();
</script>
